name: Publish
# Push a tag vX.Y.Z (bun pm version patch && git push --follow-tags) to publish @denisixnpm/mcp-gsc-tool.
# Auth is npm Trusted Publishing (OIDC): no token; configure it on npmjs.com under the package's
# Settings > Trusted Publisher (GitHub Actions, denisix/mcp-gsc-tool, publish.yml).
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # OIDC token npm exchanges for a short-lived publish credential; also signs provenance
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Tag must match package.json version
        run: test "v$(bun -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: bun run check && bun run build
      # Only this step uses npm: bun publish has no OIDC / provenance support yet. npm >= 11.5.1 is
      # required for trusted publishing; it runs on the runner's preinstalled Node.
      # shortcut: switch to `bun publish` once it supports trusted publishing.
      - run: npx --yes npm@^11.5.1 publish --access public --ignore-scripts
