name: Publish
# Push a tag vX.Y.Z (npm version patch && git push --follow-tags) to publish @denisix/mcp-gsc-tool.
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  id-token: write # npm provenance (and trusted publishing, once configured on npmjs.com)
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Tag must match package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly runs check + build
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
